<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=yes">
  <title>Shariq & Sadiya · Forever</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Jost:wght@300;400;500;600&family=Dancing+Script:wght@500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --rose: #d46a7e;
      --rose-deep: #b4455a;
      --blush: #f9d5dc;
      --soft-pink: #ffe4e9;
      --petal: #f8c8d2;
      --cream: #fff5f7;
      --gold: #d99b6c;
      --gold-soft: #eac194;
      --ink: rgba(90, 40, 50, 0.85);
      --dark-bg: #3d1e28;
      --card-bg: rgba(255, 240, 245, 0.18);
      --border: rgba(230, 160, 170, 0.45);
      --text-dark: #4a2c34;
      --shadow: 0 25px 45px rgba(120, 50, 60, 0.25);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      font-family: 'Jost', sans-serif;
      background: linear-gradient(145deg, #fce4ec 0%, #f8d5e0 30%, #fad0da 70%, #f9c5d3 100%);
      background-attachment: fixed;
      color: var(--text-dark);
      min-height: 100vh;
      overflow-x: hidden;
      position: relative;
    }

    h1, h2, h3, .serif { font-family: 'Cormorant Garamond', serif; }
    .script { font-family: 'Dancing Script', cursive; }

    .petals {
      position: fixed; inset: 0; pointer-events: none; z-index: 1; overflow: hidden;
    }
    .petal {
      position: absolute; top: -8%; font-size: 1.3rem; opacity: 0.6;
      animation: fall linear infinite; color: #e6738f;
    }
    @keyframes fall {
      0% { transform: translateY(0) translateX(0) rotate(0deg); opacity: 0; }
      10% { opacity: 0.7; }
      90% { opacity: 0.6; }
      100% { transform: translateY(110vh) translateX(25px) rotate(220deg); opacity: 0; }
    }

    .progress {
      position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
      display: flex; gap: 8px; z-index: 40; background: rgba(255,240,245,0.5);
      backdrop-filter: blur(10px); padding: 8px 18px; border-radius: 40px;
      box-shadow: 0 6px 18px rgba(180,70,90,0.2);
    }
    .dot {
      width: 7px; height: 7px; border-radius: 50%;
      background: rgba(200, 110, 130, 0.4); transition: 0.25s ease;
    }
    .dot.active { background: #c43e5a; transform: scale(1.5); box-shadow: 0 0 8px #e6738f; }
    .dot.done { background: #d98b9f; }

    .screen {
      display: none; min-height: 100vh; width: 100%;
      align-items: center; justify-content: center; flex-direction: column;
      position: relative; z-index: 2; padding: 70px 20px 60px;
    }
    .screen.active { display: flex; }
    .fade-in { animation: fadeUp 0.8s cubic-bezier(0.2, 0.9, 0.3, 1) both; }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .card {
      background: rgba(255, 245, 250, 0.7);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(220, 130, 150, 0.5);
      border-radius: 32px; padding: 40px 32px; max-width: 400px; width: 100%;
      text-align: center; box-shadow: var(--shadow);
    }
    .eyebrow {
      letter-spacing: 0.25em; text-transform: uppercase; font-size: 0.7rem;
      color: #c95b70; margin-bottom: 12px;
    }
    .card h1 { font-size: 2.1rem; font-weight: 600; color: #6d3140; margin-bottom: 6px; }
    .card .sub { font-size: 0.9rem; color: #78515a; margin-bottom: 24px; }
    .field { text-align: left; margin-bottom: 16px; }
    .field label { font-size: 0.7rem; letter-spacing: 0.08em; color: #b15a6a; margin-bottom: 5px; display: block; }
    .field input {
      width: 100%; padding: 13px 16px; border-radius: 20px;
      border: 1px solid #f0bcc8; background: rgba(255, 250, 252, 0.8);
      color: #4a2c34; font-family: 'Jost', sans-serif; outline: none;
      transition: 0.2s; font-size: 0.95rem;
    }
    .field input:focus { border-color: #d46a7e; box-shadow: 0 0 0 3px rgba(212,106,126,0.2); }
    .btn-gold {
      margin-top: 10px; width: 100%; padding: 14px 22px; border-radius: 30px;
      background: linear-gradient(135deg, #f7b7c9, #e6738f);
      color: white; font-weight: 600; font-size: 1rem; border: none;
      letter-spacing: 0.03em; cursor: pointer; transition: 0.2s;
      box-shadow: 0 10px 20px rgba(200, 90, 110, 0.3);
    }
    .btn-gold:hover { transform: translateY(-2px); box-shadow: 0 14px 24px rgba(190, 80, 100, 0.4); }
    .error { color: #c9364a; font-size: 0.8rem; margin-top: 8px; min-height: 1.2em; }

    .page-inner { max-width: 650px; width: 100%; text-align: center; }
    .next-row { display: flex; gap: 14px; justify-content: center; flex-wrap: wrap; margin-top: 32px; }
    .next-btn, .ghost-btn {
      padding: 12px 32px; border-radius: 30px; background: white; border: 1px solid #e6738f;
      color: #b0435a; font-weight: 500; cursor: pointer; transition: 0.2s;
    }
    .next-btn { background: #f9d5dc; }
    .ghost-btn { background: transparent; }

    /* upload tiles */
    .upload-grid { display: flex; gap: 18px; justify-content: center; flex-wrap: wrap; }
    .upload-tile {
      width: 160px; height: 210px; border-radius: 24px; border: 2px dashed #f0b0be;
      background: rgba(255,245,250,0.6); display: flex; flex-direction: column;
      align-items: center; justify-content: center; cursor: pointer; position: relative;
      overflow: hidden; transition: 0.2s;
    }
    .upload-tile:hover { border-color: #d46a7e; background: rgba(255,235,240,0.8); }
    .upload-tile input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
    .upload-tile video, .upload-tile img.preview {
      width: 100%; height: 100%; object-fit: cover; position: absolute; inset: 0; pointer-events: none;
    }

    /* photo envelopes */
    .envelope-grid { display: flex; gap: 24px; justify-content: center; flex-wrap: wrap; margin: 20px 0; }
    .env-item { position: relative; width: 150px; cursor: pointer; transition: 0.2s; }
    .env-item:hover { transform: translateY(-5px); }
    .env-flap {
      width: 100%; height: 110px; background: #fce0e6; border-radius: 12px 12px 0 0;
      border: 1px solid #e6a0b0; position: relative;
    }
    .env-body {
      background: #fff0f3; border-radius: 0 0 12px 12px; padding: 12px;
      border: 1px solid #e6a0b0; border-top: none;
    }
    .env-photo {
      width: 100%; height: 100px; object-fit: cover; border-radius: 8px; display: none;
    }
    .seal { position: absolute; top: 35px; left: 50%; transform: translateX(-50%); font-size: 1.8rem; }

    .modal-backdrop {
      position: fixed; inset: 0; background: rgba(70,20,30,0.7); backdrop-filter: blur(8px);
      display: none; align-items: center; justify-content: center; z-index: 60; padding: 20px;
    }
    .modal-backdrop.active { display: flex; }
    .letter-popup {
      background: #fff5f7; border-radius: 24px; padding: 30px; max-width: 350px;
      text-align: center; box-shadow: 0 30px 50px rgba(0,0,0,0.3);
    }
    .letter-popup img { width: 100%; border-radius: 16px; max-height: 200px; object-fit: cover; margin-bottom: 16px; }

    .spin-wheel-container {
      position: relative; width: 220px; height: 220px; margin: 20px auto;
    }
    canvas { width: 100%; height: 100%; }
    .spin-btn {
      margin-top: 15px; padding: 12px 30px; background: #d46a7e; color: white;
      border: none; border-radius: 30px; font-weight: bold; cursor: pointer;
    }

    @media (max-width: 500px) {
      .upload-tile { width: 130px; height: 170px; }
    }
  </style>
</head>
<body>
<div class="petals" id="petals"></div>
<div class="progress" id="progressDots"></div>

<!-- LOGIN SCREEN -->
<div class="screen active" id="screen-login">
  <div class="card fade-in">
    <div class="eyebrow">🌸 Shariq & Sadiya 🌸</div>
    <h1>Welcome back, love</h1>
    <p class="sub">Enter your shared username & password</p>
    <form id="loginForm">
      <div class="field"><label>Username</label><input id="userInput" type="text" placeholder="sadiyashariq" required></div>
      <div class="field"><label>Password</label><input id="passInput" type="password" placeholder="13032022" required></div>
      <button type="submit" class="btn-gold">Open our story</button>
      <div class="error" id="loginError"></div>
    </form>
    <p style="margin-top:16px; font-size:0.8rem; color:#a34b5c;">✨ Our date: 13 March 2022 ✨</p>
  </div>
</div>

<!-- MAIN HUB AFTER LOGIN -->
<div class="screen" id="screen-hub">
  <div class="page-inner fade-in">
    <h2 style="font-size:2.5rem; color:#953c50;">Shariq & Sadiya</h2>
    <p class="script" style="font-size:1.8rem; margin-bottom:10px;">Together since 13.03.2022</p>
    <div id="counterDisplay" style="font-size:1.2rem; margin-bottom:30px;"></div>
    <div style="display:flex; gap:16px; flex-wrap:wrap; justify-content:center;">
      <button class="next-btn" onclick="goTo('screen-videos')">🎥 Our Moments</button>
      <button class="next-btn" onclick="goTo('screen-photos')">💌 Photo Letters</button>
      <button class="next-btn" onclick="goTo('screen-games')">🎲 Games</button>
      <button class="next-btn" onclick="goTo('screen-quotes')">✨ Quotes</button>
    </div>
  </div>
</div>

<!-- VIDEOS PAGE -->
<div class="screen" id="screen-videos">
  <div class="page-inner fade-in">
    <h2>🎞️ Little films of us</h2>
    <div class="upload-grid">
      <label class="upload-tile" id="vidTile1"><input type="file" accept="video/*,image/*"><span>📁 Add video</span></label>
      <label class="upload-tile" id="vidTile2"><input type="file" accept="video/*,image/*"><span>📁 Add video</span></label>
    </div>
    <div class="next-row"><button class="ghost-btn" onclick="goTo('screen-hub')">Back</button></div>
  </div>
</div>

<!-- PHOTOS AS ENVELOPES -->
<div class="screen" id="screen-photos">
  <div class="page-inner fade-in">
    <h2>💌 Tap the envelopes</h2>
    <div class="envelope-grid" id="envelopeContainer"></div>
    <div class="next-row"><button class="ghost-btn" onclick="goTo('screen-hub')">Back</button></div>
  </div>
</div>

<!-- GAMES PAGE -->
<div class="screen" id="screen-games">
  <div class="page-inner fade-in">
    <h2>🎀 Play together</h2>
    <div style="display:flex; gap:20px; flex-wrap:wrap; justify-content:center;">
      <button class="next-btn" onclick="goTo('screen-spin')">🎡 Spin Wheel</button>
      <button class="next-btn" onclick="goTo('screen-memory')">🧠 Memory</button>
    </div>
    <div class="next-row"><button class="ghost-btn" onclick="goTo('screen-hub')">Back</button></div>
  </div>
</div>

<!-- SPIN WHEEL -->
<div class="screen" id="screen-spin">
  <div class="page-inner fade-in">
    <h2>Date night roulette</h2>
    <div class="spin-wheel-container"><canvas id="wheelCanvas" width="220" height="220"></canvas></div>
    <button class="spin-btn" id="spinAction">SPIN</button>
    <p id="spinResult" style="margin-top:16px; font-weight:500;"></p>
    <div class="next-row"><button class="ghost-btn" onclick="goTo('screen-games')">Back</button></div>
  </div>
</div>

<!-- MEMORY GAME -->
<div class="screen" id="screen-memory">
  <div class="page-inner fade-in"><h2>Match the hearts</h2><div id="memoryGrid" style="display:flex; flex-wrap:wrap; justify-content:center; gap:10px; max-width:300px; margin:20px auto;"></div>
    <div class="next-row"><button class="ghost-btn" onclick="goTo('screen-games')">Back</button></div>
  </div>
</div>

<!-- QUOTES -->
<div class="screen" id="screen-quotes">
  <div class="page-inner fade-in">
    <h2>🌟 Words to keep</h2>
    <div id="quoteDisplay" style="font-style:italic; font-size:1.4rem; margin:25px 0; min-height:80px;"></div>
    <button class="next-btn" onclick="nextQuote()">Next quote</button>
    <div class="next-row"><button class="ghost-btn" onclick="goTo('screen-hub')">Back</button></div>
  </div>
</div>

<!-- MODAL -->
<div class="modal-backdrop" id="photoModal"><div class="letter-popup" id="modalContent"></div></div>

<script>
  (function() {
    // PETALS
    const petalContainer = document.getElementById('petals');
    for (let i=0; i<20; i++) {
      const p = document.createElement('div');
      p.className = 'petal';
      p.textContent = ['🌸','🩷','💮','🌷'][i%4];
      p.style.left = Math.random()*100+'vw';
      p.style.animationDuration = (8+Math.random()*12)+'s';
      p.style.animationDelay = Math.random()*10+'s';
      petalContainer.appendChild(p);
    }

    const screens = ['screen-login','screen-hub','screen-videos','screen-photos','screen-games','screen-spin','screen-memory','screen-quotes'];
    function updateDots(id) {
      const dots = document.getElementById('progressDots');
      dots.innerHTML = '';
      screens.forEach((s,i) => {
        const d = document.createElement('div');
        d.className = 'dot' + (s===id ? ' active' : '');
        dots.appendChild(d);
      });
    }

    window.goTo = function(id) {
      document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
      document.getElementById(id).classList.add('active');
      updateDots(id);
      if (id === 'screen-hub') updateCounter();
      if (id === 'screen-spin') drawWheel();
    };

    // LOGIN
    document.getElementById('loginForm').addEventListener('submit', function(e) {
      e.preventDefault();
      const u = document.getElementById('userInput').value.trim();
      const p = document.getElementById('passInput').value.trim();
      if (u === 'sadiyashariq' && p === '13032022') {
        document.getElementById('loginError').textContent = '';
        goTo('screen-hub');
      } else {
        document.getElementById('loginError').textContent = 'Invalid credentials, try again.';
      }
    });

    // COUNTER
    const startDate = new Date('2022-03-13');
    function updateCounter() {
      const now = new Date();
      let diff = now - startDate;
      if (diff < 0) diff = 0;
      const days = Math.floor(diff / (1000*60*60*24));
      document.getElementById('counterDisplay').innerHTML = `💖 ${days} days of togetherness 💖`;
    }

    // VIDEO UPLOAD PREVIEW
    function setupVideoTile(id) {
      const tile = document.getElementById(id);
      if (!tile) return;
      const input = tile.querySelector('input');
      input.addEventListener('change', function(e) {
        const file = e.target.files[0];
        if (!file) return;
        const url = URL.createObjectURL(file);
        tile.innerHTML = '';
        if (file.type.startsWith('video')) {
          const vid = document.createElement('video');
          vid.src = url; vid.controls = true; vid.style.width='100%'; vid.style.height='100%'; vid.style.objectFit='cover';
          tile.appendChild(vid);
        } else {
          const img = document.createElement('img');
          img.src = url; img.className='preview'; tile.appendChild(img);
        }
        const reAdd = document.createElement('input');
        reAdd.type = 'file'; reAdd.accept = 'video/*,image/*';
        tile.appendChild(reAdd);
        setupVideoTile(id);
      });
    }
    setupVideoTile('vidTile1');
    setupVideoTile('vidTile2');

    // ENVELOPE PHOTOS
    const envelopeContainer = document.getElementById('envelopeContainer');
    for (let i=0; i<4; i++) {
      const div = document.createElement('div');
      div.className = 'env-item';
      div.innerHTML = `<div class="env-flap"><span class="seal">💝</span></div><div class="env-body"><input type="file" accept="image/*" style="display:none;"><img class="env-photo" src="" alt="photo"></div>`;
      const input = div.querySelector('input');
      const img = div.querySelector('img');
      div.addEventListener('click', (e) => {
        if (e.target === input) return;
        if (img.src && img.style.display !== 'none') {
          document.getElementById('modalContent').innerHTML = `<img src="${img.src}" style="max-width:100%; border-radius:20px;"><p>💌 A memory</p>`;
          document.getElementById('photoModal').classList.add('active');
        } else {
          input.click();
        }
      });
      input.addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (file) {
          const url = URL.createObjectURL(file);
          img.src = url;
          img.style.display = 'block';
        }
      });
      envelopeContainer.appendChild(div);
    }
    document.getElementById('photoModal').addEventListener('click', function(e) {
      if (e.target === this) this.classList.remove('active');
    });

    // SPIN WHEEL
    const segments = ['Movie night','Cook together','Stargazing','Dance','Picnic','Board games','Karaoke','Sunset walk'];
    let wheelAngle = 0;
    function drawWheel() {
      const canvas = document.getElementById('wheelCanvas');
      if (!canvas) return;
      const ctx = canvas.getContext('2d');
      const r = 100;
      ctx.clearRect(0,0,220,220);
      for (let i=0; i<segments.length; i++) {
        const angle = (i/segments.length)*Math.PI*2;
        ctx.beginPath();
        ctx.moveTo(110,110);
        ctx.arc(110,110,r,angle, angle+(Math.PI*2/segments.length));
        ctx.fillStyle = i%2===0 ? '#fcd5dd' : '#fce4ec';
        ctx.fill();
        ctx.stroke();
        ctx.save();
        ctx.translate(110,110);
        ctx.rotate(angle+0.4);
        ctx.fillStyle = '#6d3140';
        ctx.font = '11px Jost';
        ctx.fillText(segments[i], 45, 5);
        ctx.restore();
      }
    }
    document.getElementById('spinAction').addEventListener('click', function() {
      const spin = Math.floor(Math.random()*segments.length);
      document.getElementById('spinResult').textContent = '🎉 ' + segments[spin] + ' 🎉';
      drawWheel();
    });

    // MEMORY GAME
    window.goTo('screen-login'); // default
    const memoryGrid = document.getElementById('memoryGrid');
    function buildMemory() {
      memoryGrid.innerHTML = '';
      const icons = ['❤️','💌','🌹','💖','🎀','✨'];
      const cards = [...icons, ...icons].sort(()=>Math.random()-0.5);
      cards.forEach((icon, i) => {
        const card = document.createElement('div');
        card.style.width='60px'; card.style.height='60px'; card.style.background='#ffe0e6';
        card.style.borderRadius='12px'; card.style.display='flex'; card.style.alignItems='center'; card.style.justifyContent='center';
        card.textContent = '?';
        card.dataset.icon = icon;
        card.addEventListener('click', function() {
          if (card.textContent !== '?') return;
          card.textContent = icon;
          const flipped = [...memoryGrid.children].filter(c => c.textContent !== '?' && c !== card);
          if (flipped.length === 1 && flipped[0].dataset.icon === icon) {
            flipped[0].style.background = '#dda0b0';
            card.style.background = '#dda0b0';
          } else if (flipped.length === 1) {
            setTimeout(() => { flipped[0].textContent = '?'; card.textContent = '?'; }, 700);
          }
        });
        memoryGrid.appendChild(card);
      });
    }
    document.getElementById('screen-memory').addEventListener('click', function(e) {
      if (e.target === this) buildMemory();
    });

    // QUOTES
    const quotes = [
      "“In a sea of people, my eyes will always search for you.”",
      "“I saw that you were perfect, and so I loved you. Then I saw that you were not perfect and I loved you even more.”",
      "“You are the finest, loveliest, tenderest, and most beautiful person I have ever known.”",
      "“I swear I couldn’t love you more than I do right now, and yet I know I will tomorrow.”",
      "“If I know what love is, it is because of you.” — Hermann Hesse"
    ];
    let qIndex = 0;
    document.getElementById('quoteDisplay').textContent = quotes[0];
    window.nextQuote = function() {
      qIndex = (qIndex+1) % quotes.length;
      document.getElementById('quoteDisplay').textContent = quotes[qIndex];
    };

    updateCounter();
    updateDots('screen-login');
  })();
</script>
</body>
</html>
